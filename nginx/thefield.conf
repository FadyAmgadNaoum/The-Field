# =============================================================================
# NGINX configuration — The Field
# =============================================================================
# Doc 22 §14.5, Doc 23 §1.6/§12.6, Doc 24 §I.5.
#
# Infrastructure-level controls. These are NOT implemented inside Next.js and
# must be applied on the VPS. Not exercised by Milestone 0 validation.
# =============================================================================

# ── Real client IP behind Cloudflare ─────────────────────────────────────────
# CRITICAL — Doc 24 §I.5.
#
# With Cloudflare proxying (Doc 23 §13.1), $remote_addr is a Cloudflare edge
# address, not the visitor's. Without the directives below, every visitor shares
# a handful of rate-limit buckets: the 60/min availability limit would 429 the
# whole site within seconds of launch, and per-IP brute-force protection would
# be meaningless. No earlier document configured this.
#
# Refresh the ranges from https://www.cloudflare.com/ips/ during deployment.
# CF-Connecting-IP is trusted ONLY when it arrives from a listed range.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# ── Structured access log (Doc 23 §12.6) ─────────────────────────────────────
log_format json_combined escape=json
  '{'
    '"time":"$time_iso8601",'
    '"method":"$request_method",'
    '"path":"$request_uri",'
    '"status":$status,'
    '"duration":$request_time,'
    '"bytes":$body_bytes_sent,'
    '"ip":"$remote_addr",'
    '"request_id":"$http_x_request_id",'
    '"upstream":"$upstream_addr",'
    '"upstream_status":"$upstream_status"'
  '}';

# ── Rate limit zones (Doc 24 §I.6) ───────────────────────────────────────────
# First line of defence. The application enforces the finer per-account limits.
limit_req_zone $binary_remote_addr zone=booking_api:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general:10m     rate=120r/m;

# ── Upstreams — two application instances (Doc 24 §I.2) ──────────────────────
upstream thefield_app {
    least_conn;
    server 127.0.0.1:3000 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:3001 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name thefield.eg www.thefield.eg;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name thefield.eg www.thefield.eg;

    ssl_certificate     /etc/letsencrypt/live/thefield.eg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/thefield.eg/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/thefield_access.log json_combined;
    error_log  /var/log/nginx/thefield_error.log warn;

    # Belt-and-suspenders. src/middleware.ts sets these too, plus the CSP nonce.
    add_header X-Frame-Options        "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Slightly above the 10MB proof limit (Doc 13 T-017).
    client_max_body_size 12m;

    # ── Booking creation ─────────────────────────────────────────────────────
    # proxy_next_upstream off is MANDATORY: retrying a POST at the load balancer
    # could create a duplicate booking (Doc 23 §1.6, Doc 24 §M item 18).
    location /api/v1/bookings {
        limit_req zone=booking_api burst=5 nodelay;
        proxy_next_upstream off;
        proxy_pass http://thefield_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location /api/v1/admin/auth/login {
        limit_req zone=admin_login burst=2 nodelay;
        proxy_next_upstream off;
        proxy_pass http://thefield_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location / {
        limit_req zone=general burst=30 nodelay;
        proxy_pass http://thefield_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # GETs may be retried on a dead upstream; mutations are excluded above.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
