<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="The Field">
  <!--
    PLACEHOLDER SITE ICON.

    No logo asset or brand mark exists in Documents 00-24 (FR-CUS-004 requires
    the venue's branding to be displayed, but supplies none). This is a neutral
    geometric mark in the provisional palette from tailwind.config.ts, not an
    assertion of brand identity: a padel court outline with its centre line and
    net, which is descriptive rather than invented.

    It exists because the alternative is a 404 for /favicon.ico on every page
    load, which Lighthouse reports as a console error and which looks broken in
    a browser tab. Replace this file when the owner supplies a real mark; no
    other file needs to change.
  -->
  <rect width="32" height="32" rx="7" fill="#15803d" />
  <g fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round">
    <rect x="7" y="6" width="18" height="20" rx="1.5" />
    <line x1="7" y1="16" x2="25" y2="16" />
    <line x1="16" y1="6" x2="16" y2="26" stroke-dasharray="2 2" stroke-width="1.1" />
  </g>
</svg>
